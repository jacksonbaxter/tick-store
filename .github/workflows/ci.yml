# Every job calls scripts/check.sh, so CI runs the same steps as a local run and the two
# cannot drift. tests/scripts/test_check_sh.py fails if a step of check.sh is missing here.
#
# Both matrix axes change the build (C2). `host` changes the target: its instruction set, its
# C library, its standard library and the platform source files CMake picks. `check` selects
# a preset, and so its compile flags, or a different tool.
#
# The market data is not available here, so tests that need it skip visibly: ItchRealDay shows
# as skipped in the summary table, and is not a pass. The repo job makes the comparison's
# .venv from compare/requirements.lock, by hash, so py-compare runs its fast tests here, and
# --no-skips fails any step that would skip, so a named step cannot pass by not running. No
# job uses a secret.
#
# It is validated locally by actionlint. Its first run on GitHub failed 10 of the 14 jobs;
# docs/NOTES.md, "The first runs on GitHub Actions", has the causes and fixes. All 14 passed at
# ad542fd, in run 41825067372. The Linux clang-tidy job covers the Linux-only sources the macOS
# job cannot see.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The longer fuzz run (Z7). Tuesday, 04:17 UTC.
    - cron: "17 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A pull request fuzzes each target for 4 minutes, and the schedule for 30.
  FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '240' }}

jobs:
  check:
    name: ${{ matrix.check.name }} on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    # The scheduled fuzz jobs run seven and six targets for 30 minutes each, one after
    # another, inside a hosted job's six hours.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        host:
          - { name: linux-x86-64, runner: ubuntu-24.04, machine: x86_64 }
          - { name: macos-arm64, runner: macos-15, machine: arm64 }
        check:
          - { name: unit, only: "dev-test,oracle" }
          - { name: asan-ubsan, only: "asan-test" }
          - { name: tsan, only: "tsan-test" }
          - { name: clang-tidy, only: "clang-tidy" }
          - { name: fuzz-codecs, only: "fuzz-dictionary,fuzz-gorilla-timestamps,fuzz-gorilla-xor,fuzz-pfor,fuzz-run-length,fuzz-stream-vbyte" }
          - { name: fuzz-stores, only: "fuzz-columns,fuzz-container,fuzz-itch-frame,fuzz-itch-message,fuzz-itch-query,fuzz-itch-store,fuzz-stub-store" }
          - { name: coverage, only: "coverage" }
          - { name: repo, only: "py-scripts,py-compare,check-results,check-compare,render-check,actionlint,hygiene" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: ./.github/actions/toolchain

      - name: Confirm the runner is the host this job names
        run: test "$(uname -m)" = "${{ matrix.host.machine }}"

      - name: Make the comparison's Python environment, for py-compare
        if: matrix.check.name == 'repo'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r compare/requirements.lock

      - name: Run the checks
        env:
          ONLY: ${{ matrix.check.only }}
        run: scripts/check.sh --no-skips --fuzz-seconds "$FUZZ_SECONDS" --only "$ONLY"

      - name: Keep logs and crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-${{ matrix.check.name }}-${{ matrix.host.name }}
          path: |
            build/check/
            build/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
